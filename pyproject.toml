[project]
name = "tempo"
version = "0.1.0"
description = "Team-level engineering metrics for the AI era: did AI actually make us faster? DORA-anchored, distributions-only, no per-person views — enforced in the schema."
readme = "README.md"
authors = [
    { name = "Yavuz Ozkan" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
tempo = "tempo.cli:app"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tempo"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
